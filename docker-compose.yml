services:
  db:
    # Custom image overlaying wxyc_unaccent.rules onto railwayapp-templates/postgres-ssl
    # so the F0000 precheck in migrations/0005_wxyc_identity_match_functions.sql finds
    # the rules file at $SHAREDIR/tsearch_data/. Built + published by WXYC/wxyc-etl#127.
    # Operator runbook: https://github.com/WXYC/wxyc-etl/blob/main/docs/wxyc-postgres-image.md
    image: ghcr.io/wxyc/wxyc-postgres:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicbrainz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicbrainz}
      POSTGRES_DB: ${POSTGRES_DB:-musicbrainz}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=64MB
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_completion_target=0.9
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musicbrainz}"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

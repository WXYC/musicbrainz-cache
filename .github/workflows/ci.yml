name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings -A clippy::manual_is_multiple_of

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests (incl. local HTTP download tests)
        env:
          TEST_DOWNLOAD: "1"
        run: cargo test

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicbrainz
          POSTGRES_PASSWORD: musicbrainz
          POSTGRES_DB: musicbrainz
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U musicbrainz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable extensions
        run: |
          PGPASSWORD=musicbrainz psql -h localhost -p 5434 -U musicbrainz -d musicbrainz \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"
      - name: Install wxyc_unaccent rules into the PG service container
        # Required by migrations/0005_wxyc_identity_match_functions.sql before
        # `CREATE TEXT SEARCH DICTIONARY wxyc_unaccent (... RULES = 'wxyc_unaccent')`.
        # Alpine layout: /usr/local/share/postgresql/tsearch_data (no version subdir).
        run: |
          PG_CID=$(docker ps -q --filter ancestor=postgres:16-alpine)
          if [ -z "$PG_CID" ]; then
            echo "no postgres:16-alpine service container running" >&2
            exit 1
          fi
          docker cp vendor/wxyc-etl/wxyc_unaccent.rules \
            "$PG_CID:/usr/local/share/postgresql/tsearch_data/wxyc_unaccent.rules"
          docker cp vendor/wxyc-etl/wxyc_unaccent.version \
            "$PG_CID:/usr/local/share/postgresql/tsearch_data/wxyc_unaccent.version"
      - name: Run integration tests
        # `--ignored` picks up the new wxyc_identity_match_* parity tests
        # (postgres_parity_matches_rust_for_every_fixture_row,
        # migration_double_apply_is_a_no_op, postgres_functions_idempotent)
        # alongside the existing #[ignore]-gated tests — no separate step
        # needed.
        env:
          DATABASE_URL: postgresql://musicbrainz:musicbrainz@localhost:5434/musicbrainz
          TEST_DATABASE_URL: postgresql://musicbrainz:musicbrainz@localhost:5434/postgres
        run: cargo test -- --ignored --test-threads=1
